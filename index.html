<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSC256 Assignments</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #d0d0d0;
            font-family: Arial, sans-serif;
            color: #111111;
        }

        header {
            padding: 30px 20px;
            background-color: #1c1c1c;
            color: #d0d0d0;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
            font-size: 1.1rem;
        }

        main {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
            text-align: center;
        }

        main h2 {
            margin-bottom: 25px;
        }

        .assignment-list {
            display: grid;
            gap: 15px;
        }

        .assignment-button {
            display: block;
            padding: 18px;
            border: 3px solid #1c1c1c;
            border-radius: 8px;
            background-color: #8a8a8a;
            color: #111111;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
        }

        .assignment-button:hover {
            background-color: #555555;
            color: #eeeeee;
        }

        .final-button {
            background-color: #333333;
            color: #eeeeee;
        }

        .final-button:hover {
            background-color: #111111;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background-color: #1c1c1c;
            color: #bdbdbd;
            text-align: center;
        }

        footer p {
            margin: 0;
        }
    </style>
</head>

<body>
    <header>
        <h1>CSC256 Assignments</h1>
        <p>Tim Williams</p>
    </header>

    <main>
        <h2>Course Projects</h2>

        <section class="assignment-list">
            <a class="assignment-button" href="1.2/">
                1.2 Information Card
            </a>

            <a class="assignment-button" href="2.1/">
                2.1 JavaScript Slideshow
            </a>

            <a class="assignment-button" href="3.1/">
                3.1 JavaScript Data
            </a>

            <a class="assignment-button" href="4.1/">
                4.1 Game Elements
            </a>

            <a class="assignment-button" href="5.1/">
                5.1 Checkers
            </a>

            <a class="assignment-button final-button" href="Final/">
                Final Project: Gaia
            </a>
        </section>
    </main>

    <footer>
        <p>CSC256 — University of Advancing Technology</p>
    </footer>
</body>
</html>
